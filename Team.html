<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오 웹 - 팀 프로젝트</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="slider.css">
</head>
<body>

<!-- 네비게이션 바 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top" id="navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">포트폴리오 데모</a>
    
    <div class="d-flex align-items-center order-lg-last">
      <button class="btn btn-outline-light me-2" id="themeToggle" title="테마 전환">
        <span class="theme-icon">🌙</span>
      </button>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="index.html">포트폴리오</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="Team.html">팀 프로젝트</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="HomeWork.html">제출 과제 목록</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="Lab.html">진척도</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- 메인 콘텐츠 -->
<main class="container-fluid py-5">
  <div class="text-center my-5" style="margin-top: 10vh;">
    <h1 class="display-4 fw-bold fade-in-up">Team Projects</h1>
    <p class="lead text-muted fade-in-up">좌우로 드래그하여 프로젝트를 탐색하고, 클릭하여 상세 내용을 확인하세요.</p>
  </div>

  <!-- 프로젝트 슬라이더 컨테이너 -->
  <div class="slider-wrapper fade-in-up">
    <div class="slider-container" id="sliderContainer">
      <!-- 프로젝트 1 -->
      <div class="project-card" data-project="1">
        <div class="project-image" style="background-image: url('img/NC.png');"></div>
        <div class="project-info-brief">
          <h3>웹 프로그래밍 프로젝트</h3>
          <p>반응형 웹 포트폴리오 제작</p>
        </div>
      </div>
      <!-- 프로젝트 2 -->
      <div class="project-card" data-project="2">
        <div class="project-image" style="background-image: url('img/JAVA.png');"></div>
        <div class="project-info-brief">
          <h3>학사관리 시스템</h3>
          <p>Java를 활용한 학사관리 시스템 개발</p>
        </div>
      </div>
      <!-- 프로젝트 3 -->
      <div class="project-card" data-project="3">
        <div class="project-image" style="background-image: url('img/리눅스.jpg');"></div>
        <div class="project-info-brief">
          <h3>---</h3>
          <p>미지정</p>
        </div>
      </div>
      <!-- 프로젝트 4 -->
      <div class="project-card" data-project="4">
        <div class="project-image" style="background-image: url('img/웹프.jpeg');"></div>
        <div class="project-info-brief">
          <h3>---</h3>
          <p>미지정</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 상세 정보 영역 (동적 표시) -->
  <div class="container mt-5">
    <div id="projectDetail" class="detail-box shadow-lg fade-in">
      <div id="detailContent" class="p-4 p-md-5">
        <p class="text-center text-muted">프로젝트 카드를 클릭하면 상세 정보가 나타납니다.</p>
      </div>
    </div>
  </div>

  <!-- 팀원 소개 섹션 -->
  <div id="teamMembersSection" class="container mt-5 pt-5" style="display: none;">
    <div class="text-center mb-5">
      <h2 class="fw-bold">팀원 소개</h2>
      <p class="text-muted">프로젝트를 함께한 팀원들을 소개합니다.</p>
    </div>
    <div id="membersList" class="row g-4 justify-content-center">
      <!-- 팀원 카드가 여기에 동적으로 생성됨 -->
    </div>
  </div>
</main>

<!-- 상단 이동 버튼. 작동안함 -->
<button id="scrollTopBtn" class="scroll-top-btn" title="상단으로 이동">⬆️</button>

<!-- 푸터 -->
<footer class="bg-dark text-light text-center py-5 mt-5">
  <div class="container">
    <p class="mb-0 opacity-75">&copy; 2026 포트폴리오 웹. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="theme.js"></script>
<script src="scroll-animation.js"></script>
<script src="slider.js"></script>

</body>
</html>
